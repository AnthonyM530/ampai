<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="AMP AI: privacy policy and support.">
<title>AMP AI</title>
<style>
:root{--bg:#ffffff;--fg:#16181d;--muted:#5b6270;--line:#e4e7ec;--card:#f6f7f9;--accent:#5b3df5;}
@media (prefers-color-scheme: dark){:root{--bg:#0e0f13;--fg:#eceef2;--muted:#a2a9b6;--line:#262a33;--card:#16181f;--accent:#a594ff;}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:46rem;margin:0 auto;padding:2rem 1.25rem 4rem}
header.top{max-width:46rem;margin:0 auto;padding:1.25rem 1.25rem 0;display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap}
header.top a.brand{font-weight:700;color:var(--fg);text-decoration:none;letter-spacing:.01em}
header.top nav a{color:var(--muted);text-decoration:none;margin-left:1rem;font-size:.95rem}
header.top nav a:first-child{margin-left:0}
header.top nav a[aria-current=page]{color:var(--fg);font-weight:600}
h1{font-size:2rem;line-height:1.2;margin:1.5rem 0 .25rem}
h2{font-size:1.3rem;line-height:1.3;margin:2.5rem 0 .5rem;padding-top:1.25rem;border-top:1px solid var(--line)}
h3{font-size:1.05rem;margin:1.5rem 0 .25rem}
p,ul{margin:.75rem 0}
ul{padding-left:1.25rem}
li{margin:.35rem 0}
a{color:var(--accent)}
.meta{color:var(--muted);font-size:.95rem;margin-top:0}
.lead{font-size:1.08rem}
table{width:100%;border-collapse:collapse;margin:1rem 0;font-size:.97rem}
th,td{text-align:left;vertical-align:top;padding:.6rem .75rem;border-bottom:1px solid var(--line)}
th{font-size:.82rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
td:first-child{font-weight:600}
dl.faq dt{font-weight:600;margin-top:1.25rem}
dl.faq dd{margin:.25rem 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;margin:1rem 0}
.card p{margin:.25rem 0}
footer{max-width:46rem;margin:0 auto;padding:0 1.25rem 3rem;color:var(--muted);font-size:.9rem}
footer a{color:var(--muted)}
@media (max-width:640px){
  body{font-size:16px}
  h1{font-size:1.65rem}
  table,thead,tbody,tr,th,td{display:block}
  thead{position:absolute;left:-9999px;top:-9999px}
  tr{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:.75rem .9rem;margin:.75rem 0}
  td{border:0;padding:.15rem 0}
  td:first-child{font-size:1.02rem;margin-bottom:.25rem}
  td[data-label]:not(:first-child)::before{content:attr(data-label);display:block;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;margin-top:.5rem}
}
</style>
</head>
<body>
<header class="top"><a class="brand" href="index.html">AMP AI</a><nav><a href="privacy.html">Privacy Policy</a><a href="support.html">Support</a></nav></header>
<main>
<h1>AMP AI</h1>
<p class="lead">AI pictures and videos from your photos and words, on iPhone.</p>
<div class="card"><p><a href="privacy.html">Privacy Policy</a></p><p><a href="support.html">Support</a></p></div>
<p>Questions? Email <a href="mailto:ampsupport247@gmail.com">ampsupport247@gmail.com</a>.</p>
</main>
<footer>&copy; 2026 Anthony Magdaleno. AMP AI.</footer>
</body>
</html>
